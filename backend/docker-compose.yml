version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: aet-postgres
    environment:
      POSTGRES_USER: aet_user
      POSTGRES_PASSWORD: aet_password
      POSTGRES_DB: aet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aet-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: